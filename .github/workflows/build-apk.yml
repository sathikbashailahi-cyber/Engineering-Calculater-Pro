name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create /tmp/engineering_calculator_pro \
            --project-name=engineering_calculator_pro \
            --platforms=android

      - name: Copy application source
        run: |
          cp lib/main.dart /tmp/engineering_calculator_pro/lib/main.dart
          cp pubspec.yaml /tmp/engineering_calculator_pro/pubspec.yaml

      - name: Build APK
        working-directory: /tmp/engineering_calculator_pro
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engineering-calculator-pro-arm64
          path: /tmp/engineering_calculator_pro/build/app/outputs/flutter-apk/app-release.apk
